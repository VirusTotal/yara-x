syntax = "proto2";
import "yara.proto";

package eml;

option (yara.module_options) = {
  name : "eml"
  root_message: "eml.Eml"
  cargo_feature: "eml-module"
};

message Eml {
  // True if the file is an Eml file.
  required bool is_eml = 1;
  // key:value pairs of headers from the Eml file.
  repeated Header headers = 2;
  // the body of the Eml file from after the headers
  optional bytes body = 3;
  optional bytes decoded_body = 4;
  repeated EmlPart parts = 5;

  // Convenience fields taken from the top-level headers. Address headers are
  // parsed into individual mailboxes. RFC 2047 encoded words in `subject` and
  // in display names are decoded to UTF-8; the raw values remain available in
  // `headers`.
  repeated Address from = 6;
  repeated Address to = 7;
  repeated Address cc = 8;
  // Value of the Subject header, with encoded words decoded.
  optional bytes subject = 9;
  // Raw value of the Message-ID header.
  optional bytes message_id = 10;
  // Raw value of the Date header.
  optional bytes date = 11;
  repeated Address reply_to = 12;
  optional Address return_path = 13;
}

// A mailbox, like `John Doe <john@example.com>`.
message Address {
    // Display name, with quotes removed. Absent if there is none.
    optional bytes name = 1;
    // The address itself, like `john@example.com`.
    optional bytes address = 2;
}

message EmlPart {
    // key:value pairs of headers from the Eml file.
    repeated Header headers = 1;
    // the body of the Eml file from after the headers
    required bytes body = 2;
    optional bytes decoded_body = 3;
    // filename from Content-Disposition or Content-Type name parameter
    optional bytes filename = 4;
    // determine if the part is an attachment or inline
    optional bytes disposition = 5;
    // Media type without parameters, lowercased, like `text/html`.
    optional bytes content_type = 6;
    // The `charset` parameter of Content-Type, if any.
    optional bytes charset = 7;
    // Content-ID without the surrounding angle brackets.
    optional bytes content_id = 8;
    // Size in bytes of the decoded body, or of the body if it isn't encoded.
    optional int64 size = 9;
}

// Structure used to represent a header key: value pair
message Header {
    required bytes key = 1;
    required bytes value = 2;
}
