name: Update playground

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'YARA-X version (e.g. 1.22.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: playground/.nvmrc
        cache: 'npm'
        cache-dependency-path: playground/package-lock.json

    - name: Update playground
      run: python3 .github/scripts/update_playground.py "$VERSION"

    - name: Create pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        base: main
        branch: chore/update-playground-${{ inputs.version }}
        title: 'chore(playground): update LS and YARA-X to ${{ inputs.version }}'
        commit-message: 'chore(playground): update LS and YARA-X to ${{ inputs.version }}'
        body: |
          Update the scanner and regenerate the Language Server WASM for YARA-X ${{ inputs.version }}.
        add-paths: |
          playground/package.json
          playground/package-lock.json
          playground/src/wasm/yara-x-ls/pkg/
